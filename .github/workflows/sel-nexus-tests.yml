# Added by SEL Nexus CyberSuite (Application Vulnerabilities): runs this repository's tests on the AI fix
# branch. When a test fails, the suite's AI fixes it and pushes again, which runs this workflow again.
name: SEL Nexus tests
on:
  push:
    branches: ['ai-remediation/9c02980c-6e3718dd']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sel-nexus-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install pytest
      - name: Run all tests
        run: python -m pytest -rA --tb=short
